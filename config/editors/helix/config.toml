theme = "gruvbox-material-dark-hard"

[editor]
# y/p 默认使用系统剪贴板寄存器 "+"：
# helix 25.x 起 y 默认写 '"'（内部寄存器），只有写 '+'/'*' 才会调用 clipboard provider
# （register.rs: write('+') → set_contents）。设为此项后 y = 复制到系统剪贴板。
default-yank-register = "+"
auto-save = true
auto-format = true
bufferline = "multiple"
color-modes = true
completion-replace = true
cursorcolumn = false
cursorline = true
line-number = "relative"
mouse = true
rulers = [79]
true-color = true
# 让 Helix 使用终端定义的光标形状，这有助于同步协议状态
# use-terminal-cursor = true

# 剪贴板说明（不设置 clipboard-provider，使用默认自动探测）：
# - macOS 本地: 探测到 pbcopy/pbpaste => pasteboard，y 直接写系统剪贴板
# - SSH 远程 (无 Wayland/X11): 回落到 termcode (OSC52)，由本地终端写入剪贴板，
#   要求本地终端支持 OSC52（Alacritty 支持；tmux 内需 `set -g set-clipboard on`）
# 如需强制指定，可选值: pasteboard, wayland, x-clip, x-sel, win32-yank,
# tmux, termux, termcode, custom, none

[editor.whitespace.render]
space = "none"
nbsp = "none"
tab = "none"
newline = "none"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
tab = "→"
newline = "⏎"
tabpad = "·" # Tabs will look like "→···" (depending on tab width)

[editor.file-picker]
hidden = false
git-ignore = false

[editor.statusline]
left = [
  "mode",
  "spacer",
  "version-control",
  "spacer",
  "separator",
  "file-name",
  "file-modification-indicator"
]
right = [
  "spinner",
  "spacer",
  "workspace-diagnostics",
  "separator",
  "spacer",
  "diagnostics",
  "position",
  "file-encoding",
  "file-line-ending",
  "file-type"
]
separator = "╎"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "╎" # Some characters that work well: "▏", "┆", "┊", "╎"
skip-levels = 0

[editor.soft-wrap]
enable = true
max-wrap = 10 # increase value to reduce forced mid-word wrapping
max-indent-retain = 40

[keys.normal]
# SpaceVim 习惯的 buffer 切换：
# Tab/Shift-Tab 循环切换 buffer（normal 模式 Tab 默认无绑定，缩进仍在 >/< 上）
tab = "goto_next_buffer"
S-tab = "goto_previous_buffer"
# Alt+数字 直达：helix 无 ":buffer N" 命令，无法按索引直达（改用 <Space>b picker）
# ";" = { w = ":w", q = ":q" }
# "C-/" = "toggle_comments"
# esc is remapped to capslock locally
# esc = ["collapse_selection", "keep_primary_selection", ":w"]
# C-v = "vsplit"
# C-h = "jump_view_left"
# C-j = "jump_view_down"
# C-k = "jump_view_up"
# C-l = "jump_view_right"
# "C-," = "goto_previous_buffer"
# "C-." = "goto_next_buffer"
# "K" = "insert_newline"
# # Move line up/down using A-k, A-j
# "A-k" = [
#   "extend_to_line_bounds",
#   "delete_selection",
#   "move_line_up",
#   "paste_before"
# ]
# "A-j" = [
#   "extend_to_line_bounds",
#   "delete_selection",
#   "move_line_down",
#   "paste_before"
# ]

[keys.normal.g]
# q = ":bc"
# Q = ":bc!"

# Remove vscode "training wheels"
# Comment this to enable arrow navigation in insert mode
[keys.insert]
# j = { k = "normal_mode" }
# up = "no_op"
# down = "no_op"
# left = "no_op"
# right = "no_op"
# pageup = "no_op"
# pagedown = "no_op"
# home = "no_op"
# end = "no_op"
# VSCode-like auto-completeion (pretty much all IDEs do it on C-space)
# "C-space" = "completion"

# Config Mode
[keys.normal."C-backspace"]
